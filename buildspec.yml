version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install pipenv
      - pipenv install --deploy --ignore-pipfile
  build:
    commands:
      - pipenv run pip freeze > requirements.txt
      - zip -r function.zip .
  post_build:
    commands:
      - aws lambda update-function-code --function-name MonLambdaFunction --zip-file fileb://function.zip
artifacts:
  files:
    - function.zip
